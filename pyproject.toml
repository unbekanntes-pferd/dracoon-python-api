[project]
name = "dracoon"
version = "1.14.0"
description = "DRACOON API wrapper in Python"
authors = [{ name = "Octavio Simone", email = "o.simone@dracoon.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0,<1",
    "pydantic>=2.6.3,<3",
    "cryptography>=44.0.1",
    "tenacity>=8.2.3",
]

[project.urls]
Repository = "https://github.com/unbekanntes-pferd/dracoon-python-api"

[dependency-groups]
dev = [
    "respx>=0.22.0",
    "pytest>=8",
    "pytest-cov>=5",
    "python-dotenv>=1",
    "ruff>=0.8",
]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/e2e"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.ruff.lint]
# ruff defaults - bugs and likely errors, no style rules
select = ["E4", "E7", "E9", "F"]
# code base idioms, no bugs: one line if statements, comparisons with None / True
ignore = ["E701", "E711", "E712"]
