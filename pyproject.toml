[project]
name = "dracoon"
version = "1.13.0"
description = "DRACOON API wrapper in Python"
authors = [{ name = "Octavio Simone", email = "o.simone@dracoon.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0,<0.28",
    "pydantic>=2.6.3,<3",
    "cryptography>=42.0.5",
    "tenacity>=8.2.3",
]

[project.urls]
Repository = "https://github.com/unbekanntes-pferd/dracoon-python-api"

[dependency-groups]
dev = [
    "respx>=0.20.2",
    "pytest>=8",
    "pytest-cov>=5",
    "python-dotenv>=1",
]

[tool.uv]
# pinned to poetry.lock versions for the uv migration - remove when updating dependencies
constraint-dependencies = [
    "annotated-types==0.6.0",
    "anyio==4.3.0",
    "certifi==2024.7.4",
    "cffi==1.16.0",
    "cryptography==42.0.5",
    "exceptiongroup==1.2.0",
    "h11==0.14.0",
    "httpcore==1.0.4",
    "httpx==0.27.0",
    "idna==3.7",
    "pycparser==2.21",
    "pydantic==2.6.3",
    "pydantic-core==2.16.3",
    "respx==0.20.2",
    "sniffio==1.3.1",
    "tenacity==8.2.3",
    "typing-extensions==4.10.0",
]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/e2e"

[build-system]
requires = ["uv_build>=0.8.11,<0.9"]
build-backend = "uv_build"
