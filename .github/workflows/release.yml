name: release

# publish to PyPI on version tags (e.g. v1.14.0) via trusted publishing, then create the GitHub release
# requires a PyPI trusted publisher for this repository, workflow release.yml and environment pypi
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: "3.12"
    - name: Check tag matches package version
      run: |
        version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
          exit 1
        fi
    - name: Install dependencies
      run: uv sync --locked
    - name: Run unit tests
      run: uv run pytest
    - name: Build package
      run: uv build
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/
        if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/dracoon/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    - name: Publish to PyPI
      run: uv publish
  github-release:
    # release page entry with generated notes and the published packages
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
