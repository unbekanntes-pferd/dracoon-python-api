name: dracoon e2e tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    environment:
      testing
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_SERVER_BASE_URL: ${{ secrets.E2E_SERVER_BASE_URL }}
      E2E_USER_NAME: ${{ secrets.E2E_USER_NAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_ENCRYPTION_PASSWORD: ${{ secrets.E2E_ENCRYPTION_PASSWORD }}
      IS_GITHUB_ACTION: ${{ secrets.IS_GITHUB_ACTION }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: "3.12"
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked
    - name: Run e2e tests
      run: uv run pytest tests/e2e
