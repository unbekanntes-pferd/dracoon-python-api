name: dracoon e2e tests

on:
  workflow_dispatch:

permissions:
  contents: read

# tests are isolated (unique test data per test) - only runs of the same ref are queued
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    environment:
      testing
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_USER_NAME: ${{ secrets.E2E_USER_NAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_ROOM_ID: ${{ secrets.E2E_ROOM_ID }}
      E2E_EMAIL_DOMAIN: ${{ secrets.E2E_EMAIL_DOMAIN }}
      E2E_CRYPTO_ROOM_ID: ${{ secrets.E2E_CRYPTO_ROOM_ID }}
      E2E_CRYPTO_SECRET: ${{ secrets.E2E_CRYPTO_SECRET }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: "3.12"
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked
    - name: Run e2e tests
      run: uv run pytest tests/e2e -n auto
