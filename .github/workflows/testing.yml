name: dracoon tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked
    - name: Run unit tests
      run: uv run pytest --cov=dracoon --cov-report=term
  test-lowest:
    # verify minimum supported dependency versions (pyproject.toml lower bounds)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv with Python 3.10
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: "3.10"
    - name: Install lowest direct dependencies
      run: uv sync --resolution lowest-direct
    - name: Run unit tests
      run: uv run --no-sync pytest
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    - name: Build package
      run: uv build
    - name: Smoke test wheel
      # run outside the checkout so the installed wheel is imported, not ./dracoon
      working-directory: ${{ runner.temp }}
      run: uv run --isolated --no-project --with "$(ls $GITHUB_WORKSPACE/dist/*.whl)" python -c "import dracoon, dracoon.nodes, dracoon.crypto; print(dracoon.__file__)"
